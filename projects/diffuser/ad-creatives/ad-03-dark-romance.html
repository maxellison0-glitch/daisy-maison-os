<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-dark-romance.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.5) 0%,
      rgba(0,0,0,0) 20%,
      rgba(0,0,0,0) 75%,
      rgba(0,0,0,0.6) 100%
    );
  }

  .top {
    position: absolute; top: 48px; left: 56px; right: 56px;
    z-index: 2;
  }

  .hook {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 72px;
    line-height: 1.1;
    color: #fff;
    letter-spacing: -1px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }

  .bottom {
    position: absolute; bottom: 48px; left: 56px; right: 56px;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tagline {
    font-size: 26px;
    font-weight: 500;
    color: #fff;
    opacity: 0.9;
    text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    line-height: 1.4;
  }

  .cta-pill {
    display: inline-flex;
    align-items: center;
    background: rgba(250,246,238,0.95);
    color: #4A3A2C;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    padding: 16px 36px;
    border-radius: 50px;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    width: fit-content;
  }

  .price-big {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 64px;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="top">
    <div class="hook">Not another<br>candle.</div>
  </div>
  <div class="bottom">
    <div class="left-col">
      <div class="tagline">Personalised. Gift-boxed.<br>Made in our UK workshop.</div>
      <div class="cta-pill">Personalise yours &rarr;</div>
    </div>
    <div class="price-big">£14.95</div>
  </div>
</body>
</html>
