<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }
  .bg {
    width: 100%; height: 100%;
    background: url('real-giftbox-top.jpg') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.15) 20%,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,0.2) 80%,
      rgba(0,0,0,0.65) 100%
    );
  }
  .top-text {
    position: absolute; top: 52px; left: 60px; right: 60px;
    z-index: 2;
  }
  .hook {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 58px;
    line-height: 1.15;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
  .bottom-text {
    position: absolute; bottom: 56px; left: 60px; right: 60px;
    z-index: 2;
  }
  .subline {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 500;
    color: #fff;
    opacity: 0.9;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }
  .badge {
    display: inline-block;
    background: #FAF6EE;
    color: #4A3A2C;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    padding: 14px 32px;
    border-radius: 50px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="top-text">
    <div class="hook">Made to order.<br>Made today.</div>
  </div>
  <div class="bottom-text">
    <div class="subline">A personalised reed diffuser, handmade in our UK workshop. From £14.95</div>
    <div class="badge">Daisy Maison</div>
  </div>
</body>
</html>
