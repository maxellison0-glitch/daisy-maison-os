<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-wedding-table.png') center 30% / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Frosted cream panel at bottom */
  .panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 380px;
    background: rgba(250, 246, 238, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(74, 58, 44, 0.12);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
    z-index: 2;
  }

  .eyebrow {
    font-size: 15px;
    font-weight: 600;
    color: #9B8A76;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 48px;
    line-height: 1.2;
    color: #4A3A2C;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }

  .sub {
    font-size: 24px;
    font-weight: 400;
    color: #6B5B4B;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    background: #4A3A2C;
    color: #FAF6EE;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    padding: 18px 40px;
    border-radius: 50px;
    letter-spacing: 0.5px;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    color: #4A3A2C;
  }

  /* Subtle top vignette to separate image from panel */
  .vignette {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.15) 0%,
      transparent 15%,
      transparent 65%,
      rgba(0,0,0,0.08) 100%
    );
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="panel">
    <div class="eyebrow">Personalised Wedding Gifts</div>
    <div class="headline">The gift they'll keep forever.</div>
    <div class="sub">Their name and date, on a handmade reed diffuser.</div>
    <div class="row">
      <div class="cta-btn">Personalise yours</div>
      <div class="price">£14.95</div>
    </div>
  </div>
</body>
</html>
