<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    /* Product sits in top-center — keep it fully visible */
    background: url('hero-wedding-table.png') center 20% / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Cream block at bottom — sits BELOW the product, not over it */
  .text-block {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 320px;
    background: #FAF6EE;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
  }

  /* Gradient blend from image to cream */
  .blend {
    position: absolute;
    bottom: 320px; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent 0%, #FAF6EE 100%);
    z-index: 1;
  }

  .eyebrow {
    font-size: 14px;
    font-weight: 600;
    color: #9B8A76;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 46px;
    line-height: 1.2;
    color: #4A3A2C;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }

  .sub {
    font-size: 23px;
    font-weight: 400;
    color: #6B5B4B;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .cta-btn {
    display: inline-flex;
    background: #4A3A2C;
    color: #FAF6EE;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    padding: 16px 40px;
    border-radius: 50px;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    color: #4A3A2C;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blend"></div>
  <div class="text-block">
    <div class="eyebrow">Personalised Wedding Gifts</div>
    <div class="headline">The gift they'll keep forever.</div>
    <div class="sub">Their name and date, on a handmade reed diffuser.</div>
    <div class="row">
      <div class="cta-btn">Personalise yours</div>
      <div class="price">£14.95</div>
    </div>
  </div>
</body>
</html>
