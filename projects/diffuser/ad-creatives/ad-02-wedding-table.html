<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-wedding-table.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Light vignette top + bottom for text */
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0) 18%,
      rgba(0,0,0,0) 70%,
      rgba(0,0,0,0.5) 100%
    );
  }

  .top {
    position: absolute; top: 48px; left: 56px; right: 56px;
    z-index: 2;
  }

  .eyebrow {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  .hook {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 48px;
    line-height: 1.15;
    color: #fff;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }

  .bottom {
    position: absolute; bottom: 56px; left: 56px; right: 56px;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sub {
    font-size: 22px;
    font-weight: 400;
    color: #fff;
    opacity: 0.9;
    text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    line-height: 1.4;
  }

  .cta-btn {
    display: inline-flex;
    background: rgba(250,246,238,0.95);
    color: #4A3A2C;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    padding: 16px 36px;
    border-radius: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    width: fit-content;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 56px;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="top">
    <div class="eyebrow">Personalised Wedding Gifts</div>
    <div class="hook">The gift they'll<br>keep forever.</div>
  </div>
  <div class="bottom">
    <div class="left-col">
      <div class="sub">Their name and date, on a<br>handmade reed diffuser.</div>
      <div class="cta-btn">Personalise yours &rarr;</div>
    </div>
    <div class="price">£14.95</div>
  </div>
</body>
</html>
