<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    /* Push the product UP so it sits in the top 60% with breathing room */
    background: url('hero-clean.png') center 25% / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Clean cream block at the very bottom — BELOW the product, not over it */
  .text-block {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 340px;
    background: #FAF6EE;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
  }

  /* Soft blend from photo to cream block */
  .blend {
    position: absolute;
    bottom: 340px; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(180deg, transparent 0%, #FAF6EE 100%);
    z-index: 1;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 52px;
    line-height: 1.2;
    color: #4A3A2C;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }

  .sub {
    font-size: 24px;
    font-weight: 400;
    color: #6B5B4B;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .price-pill {
    display: inline-flex;
    background: #4A3A2C;
    color: #FAF6EE;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    padding: 16px 36px;
    border-radius: 50px;
  }

  .cta {
    font-size: 21px;
    font-weight: 500;
    color: #4A3A2C;
    opacity: 0.65;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blend"></div>
  <div class="text-block">
    <div class="headline">Their name. Their date.<br>Their home.</div>
    <div class="sub">A personalised reed diffuser, handmade in our UK workshop.</div>
    <div class="row">
      <div class="price-pill">From £14.95</div>
      <div class="cta">Shop personalised gifts &rarr;</div>
    </div>
  </div>
</body>
</html>
