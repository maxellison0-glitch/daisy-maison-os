<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-clean.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,0.6) 100%
    );
  }

  .top-badge {
    position: absolute; top: 48px; left: 56px;
    z-index: 2;
    background: #4A3A2C;
    color: #FAF6EE;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 12px 24px;
    border-radius: 6px;
  }

  .bottom {
    position: absolute; bottom: 56px; left: 56px; right: 56px;
    z-index: 2;
  }

  .intro-label {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    margin-bottom: 8px;
  }

  .price-hero {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 96px;
    line-height: 1;
    color: #fff;
    letter-spacing: -2px;
    text-shadow: 0 3px 24px rgba(0,0,0,0.4);
    margin-bottom: 12px;
  }

  .sub {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .cta-pill {
    display: inline-flex;
    background: rgba(250,246,238,0.95);
    color: #4A3A2C;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    padding: 16px 36px;
    border-radius: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="top-badge">New</div>
  <div class="bottom">
    <div class="intro-label">Introductory Offer</div>
    <div class="price-hero">£14.95</div>
    <div class="sub">A personalised reed diffuser with their name<br>and wedding date. Handmade. Gift-boxed.</div>
    <div class="cta-pill">Personalise yours &rarr;</div>
  </div>
</body>
</html>
