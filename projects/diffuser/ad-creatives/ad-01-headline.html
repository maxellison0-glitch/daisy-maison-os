<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-clean.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Subtle gradient at bottom for text legibility */
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 65%,
      rgba(0,0,0,0.55) 100%
    );
  }

  .top-brand {
    position: absolute; top: 48px; left: 56px;
    z-index: 2;
    font-size: 14px;
    font-weight: 600;
    color: #4A3A2C;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .bottom {
    position: absolute; bottom: 56px; left: 56px; right: 56px;
    z-index: 2;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 52px;
    line-height: 1.15;
    color: #fff;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
    margin-bottom: 16px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .price-pill {
    display: inline-flex;
    background: rgba(250,246,238,0.95);
    color: #4A3A2C;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    padding: 14px 32px;
    border-radius: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .cta {
    font-size: 20px;
    font-weight: 500;
    color: #fff;
    opacity: 0.85;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="top-brand">Daisy Maison</div>
  <div class="bottom">
    <div class="headline">Their name. Their date.<br>Their home.</div>
    <div class="row">
      <div class="price-pill">From £14.95</div>
      <div class="cta">Shop personalised gifts &rarr;</div>
    </div>
  </div>
</body>
</html>
