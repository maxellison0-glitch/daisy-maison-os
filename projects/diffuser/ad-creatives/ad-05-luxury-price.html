<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-velvet-candles.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.3) 0%,
      rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 50%,
      rgba(0,0,0,0.2) 75%,
      rgba(0,0,0,0.7) 100%
    );
  }

  /* Centred price lockup */
  .center-lockup {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    text-align: center;
  }

  .eyebrow {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .price-hero {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 140px;
    line-height: 1;
    color: #fff;
    letter-spacing: -3px;
    text-shadow: 0 4px 40px rgba(0,0,0,0.35);
    margin-bottom: 8px;
  }

  .surprise {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 36px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    letter-spacing: 1px;
  }

  .bottom {
    position: absolute;
    bottom: 56px; left: 64px; right: 64px;
    z-index: 2;
  }

  .tagline {
    font-size: 28px;
    font-weight: 400;
    color: #fff;
    opacity: 0.85;
    text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    margin-bottom: 24px;
    line-height: 1.4;
    text-align: center;
  }

  .bottom-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    align-items: center;
  }

  .cta-pill {
    display: inline-flex;
    background: #FAF6EE;
    color: #4A3A2C;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    padding: 18px 44px;
    border-radius: 50px;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }

  /* Top brand */
  .brand {
    position: absolute; top: 48px; left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="brand">Daisy Maison</div>
  <div class="center-lockup">
    <div class="eyebrow">Personalised Wedding Gift</div>
    <div class="price-hero">£14.95</div>
    <div class="surprise">Seriously.</div>
  </div>
  <div class="bottom">
    <div class="tagline">A personalised reed diffuser with their name and wedding date.<br>Handmade. Gift-boxed. Under fifteen quid.</div>
    <div class="bottom-row">
      <div class="cta-pill">Personalise yours &rarr;</div>
    </div>
  </div>
</body>
</html>
