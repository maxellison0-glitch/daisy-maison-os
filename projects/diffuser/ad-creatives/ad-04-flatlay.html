<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-flatlay.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Cream band at bottom with frosted glass */
  .band {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 260px;
    background: rgba(250,246,238,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 2;
    display: flex;
    align-items: center;
    padding: 0 64px;
  }

  .band-content {
    width: 100%;
  }

  .features {
    display: flex;
    gap: 48px;
    margin-bottom: 24px;
  }

  .feat {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .feat-label {
    font-size: 13px;
    font-weight: 600;
    color: #9B8A76;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .feat-val {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    color: #4A3A2C;
    letter-spacing: -0.3px;
  }

  .divider {
    width: 1px;
    height: 48px;
    background: rgba(74,58,44,0.15);
    align-self: center;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #9B8A76;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .cta {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #4A3A2C;
    letter-spacing: 0.3px;
  }

  /* Top label */
  .top-label {
    position: absolute;
    top: 48px; left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: rgba(250,246,238,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 40px;
    border-radius: 50px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: #4A3A2C;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="top-label">Wedding Gift Ideas</div>
  <div class="band">
    <div class="band-content">
      <div class="features">
        <div class="feat">
          <div class="feat-label">Personalised</div>
          <div class="feat-val">Their name</div>
        </div>
        <div class="divider"></div>
        <div class="feat">
          <div class="feat-label">Gift boxed</div>
          <div class="feat-val">Ready to give</div>
        </div>
        <div class="divider"></div>
        <div class="feat">
          <div class="feat-label">Price</div>
          <div class="feat-val">From £14.95</div>
        </div>
      </div>
      <div class="bottom-row">
        <div class="brand-name">Daisy Maison</div>
        <div class="cta">Shop now &rarr;</div>
      </div>
    </div>
  </div>
</body>
</html>
