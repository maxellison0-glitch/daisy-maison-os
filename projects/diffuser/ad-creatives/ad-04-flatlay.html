<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    background: url('hero-flatlay.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Soft gradient bottom only */
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 70%,
      rgba(0,0,0,0.5) 100%
    );
  }

  .top-brand {
    position: absolute; top: 48px; left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-size: 14px;
    font-weight: 600;
    color: #4A3A2C;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.65;
  }

  .bottom {
    position: absolute; bottom: 56px; left: 56px; right: 56px;
    z-index: 2;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.2;
    color: #fff;
    letter-spacing: -0.3px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
    margin-bottom: 16px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .features {
    display: flex;
    gap: 24px;
  }

  .feat {
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }

  .feat-sep {
    color: rgba(255,255,255,0.4);
  }

  .cta {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="top-brand">Daisy Maison</div>
  <div class="bottom">
    <div class="headline">A wedding gift with<br>their name on it.</div>
    <div class="row">
      <div class="features">
        <span class="feat">Personalised</span>
        <span class="feat-sep">·</span>
        <span class="feat">Gift boxed</span>
        <span class="feat-sep">·</span>
        <span class="feat">From £14.95</span>
      </div>
      <div class="cta">Shop now &rarr;</div>
    </div>
  </div>
</body>
</html>
