<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }

  .bg {
    width: 100%; height: 100%;
    /* Show the full gift box + tag — product is the star */
    background: url('hero-flatlay.png') center 35% / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }

  /* Cream block at bottom — BELOW the product */
  .text-block {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 360px;
    background: #FAF6EE;
    z-index: 2;
    padding: 40px 64px;
  }

  /* Blend from photo to block */
  .blend {
    position: absolute;
    bottom: 360px; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent 0%, #FAF6EE 100%);
    z-index: 1;
  }

  .features {
    display: flex;
    gap: 40px;
    margin-bottom: 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid rgba(74,58,44,0.12);
  }

  .feat {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .feat-label {
    font-size: 13px;
    font-weight: 600;
    color: #9B8A76;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .feat-val {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    color: #4A3A2C;
    letter-spacing: -0.3px;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.2;
    color: #4A3A2C;
    margin-bottom: 20px;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-name {
    font-size: 15px;
    font-weight: 600;
    color: #9B8A76;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .cta {
    font-size: 20px;
    font-weight: 600;
    color: #4A3A2C;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blend"></div>
  <div class="text-block">
    <div class="features">
      <div class="feat">
        <div class="feat-label">Personalised</div>
        <div class="feat-val">Their name</div>
      </div>
      <div class="feat">
        <div class="feat-label">Gift boxed</div>
        <div class="feat-val">Ready to give</div>
      </div>
      <div class="feat">
        <div class="feat-label">Price</div>
        <div class="feat-val">From £14.95</div>
      </div>
    </div>
    <div class="headline">A wedding gift with their name on it.</div>
    <div class="bottom-row">
      <div class="brand-name">Daisy Maison</div>
      <div class="cta">Shop now &rarr;</div>
    </div>
  </div>
</body>
</html>
