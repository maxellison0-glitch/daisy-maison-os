<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; position: relative; font-family: 'DM Sans', sans-serif; }
  .bg {
    width: 100%; height: 100%;
    background: url('hero-studio.png') center center / cover no-repeat;
    position: absolute; top: 0; left: 0;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 45%,
      rgba(0,0,0,0.15) 65%,
      rgba(0,0,0,0.55) 85%,
      rgba(0,0,0,0.7) 100%
    );
  }
  .content {
    position: absolute; bottom: 60px; left: 60px; right: 60px;
    color: #fff;
    z-index: 2;
  }
  .price {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 120px;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 16px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .tagline {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.3;
    opacity: 0.95;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    margin-bottom: 24px;
  }
  .subline {
    font-size: 24px;
    font-weight: 400;
    opacity: 0.8;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  .badge {
    position: absolute; top: 48px; right: 48px;
    background: #FAF6EE;
    color: #4A3A2C;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    padding: 14px 28px;
    border-radius: 50px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 2;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="badge">Daisy Maison</div>
  <div class="content">
    <div class="price">£14.95</div>
    <div class="tagline">A personalised wedding gift.<br>Their name. Their date.</div>
    <div class="subline">Made to order in our UK workshop</div>
  </div>
</body>
</html>
