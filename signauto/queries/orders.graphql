# The one query. Save each page's reply VERBATIM as plan/orders-pN.json -
# plan-batch.py reads the raw {data:{orders:{nodes:[...]}}} shape as-is, and a
# hand-reshape is a place for signs to go missing.
#
# Page with the $after variable until hasNextPage is false.
#
# The created_at bound is not cosmetic: ancient orders marked unfulfilled would
# otherwise reappear in every plan forever. Move it forward as the backlog ages.
#
# Do NOT filter by SKU here. plan-batch.py decides what is a sign from
# production/product-rules.json - a second filter is a second thing to keep in sync.
query UnfulfilledStreetSigns($after: String) {
  orders(first: 50, after: $after,
         query: "fulfillment_status:unfulfilled AND financial_status:paid AND created_at:>2026-01-01",
         sortKey: CREATED_AT, reverse: true) {
    pageInfo { hasNextPage endCursor }
    nodes {
      name createdAt
      customer { displayName }
      lineItems(first: 25) {
        nodes {
          id sku title quantity unfulfilledQuantity
          product { handle }
          customAttributes { key value }
        }
      }
    }
  }
}
