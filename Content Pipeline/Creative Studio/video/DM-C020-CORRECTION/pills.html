<meta charset="utf-8">
<style>
@font-face{font-family:"TikTok Sans";src:url("fonts/TikTokSans-ExtraBold.woff2") format("woff2");font-weight:800}
:root{--ink:#0E0E0E;--paper:#FFF;--pill-white:rgba(255,255,255,0.94);--burgundy:#6E1B2D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{display:inline-block;padding:30px}          /* padding = room for the shadow */
.p{display:inline-block;font-family:"TikTok Sans";font-weight:800;font-size:78px;
   line-height:1.12;letter-spacing:-0.01em;border-radius:999px;padding:0.24em 0.60em;
   box-shadow:0 4px 14px rgba(0,0,0,0.16);white-space:nowrap}
.white{color:var(--ink);background:var(--pill-white)}
.burg{color:var(--paper);background:var(--burgundy)}
</style>
<body><span class="p CLS">TEXT</span></body>
