<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/Fraunces-600.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #FAF6EE;
        font-family: "Fraunces", "EB Garamond", serif;
      }

      /* The footage is natively 1080x1920, so it fills the frame edge to edge.
         No cream bands, no letterbox, no push-in on a still. That difference is
         the whole point of this piece - Max, 28 Jul 2026: "an image with video
         formats around it is just a useless concept. If we're doing a video, it
         needs to be a video." */
      #footage {
        position: absolute; left: 0; top: 0;
        width: 1080px; height: 1920px; display: block; object-fit: cover;
      }

      /* Hooks sit in the TOP third. TikTok's own UI - caption, handle, music
         ticker, the action rail - lives along the bottom and the right, so
         anything placed there gets covered on the platform that matters most. */
      .hook {
        position: absolute; left: 0; top: 104px; width: 1080px;
        display: flex; justify-content: center;
      }
      .pill {
        font-weight: 600; color: #4A3A2C;
        background: rgba(250, 246, 238, 0.96);
        border-radius: 999px; white-space: nowrap; line-height: 1;
        box-shadow: 0 6px 22px rgba(30, 25, 20, 0.28);
        font-size: 56px; padding: 30px 52px 36px;
      }
      /* The sign-off is quieter than the hook on purpose: by then the product
         has already done the talking and this only needs to say who made it. */
      .pill.quiet { font-size: 44px; padding: 24px 44px 28px; }
      /* 1400x480 wordmark. At 40px tall the strapline under DAISY MAISON was
         a grey smudge on a phone - present, unreadable, worse than absent. */
      .pill.quiet img {
        height: 84px; display: block; margin: 0 auto 16px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="footage"
        class="clip"
        data-start="0"
        data-duration="6"
        data-media-start="0"
        data-track-index="0"
        src="assets/native.mp4"
        muted
        playsinline
      ></video>

      <!-- Three-component hook (ad-creative/hook-system): the VISUAL is her
           lifting the sign, the CAPTION is the post copy, and this on-screen
           line is the third component. It must not restate either. So it does
           not say "summer holidays" and it does not count days - the sign
           already does both. It sets up the sign as the thing she could not
           say out loud, and the reveal is the punchline. -->
      <div id="hook-1" class="hook clip" data-start="0.2" data-duration="3.4" data-track-index="1">
        <!-- Inner wrapper: the clip element's own visibility belongs to the
             framework, so the exit tween and its hard kill live in here. Without
             this split the lint gate fails with gsap_exit_missing_hard_kill and
             a non-linear seek past 3.4s finds stale visibility. -->
        <div id="hook-1-inner"><div class="pill">It felt rude to say it out loud.</div></div>
      </div>

      <!-- 3.6s to 4.9s is deliberately empty. The sign is fully readable by
           then and covering the payoff with more type is how the last one went
           wrong. -->

      <div id="signoff" class="hook clip" data-start="4.9" data-duration="1.1" data-track-index="1">
        <div id="signoff-inner">
          <div class="pill quiet">
            <img src="assets/wordmark.png" alt="Daisy Maison" />
            Any wording you like.
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // No tween on the footage. The motion is real motion that was generated;
      // adding a synthetic push-in on top would put us straight back to faking
      // movement on a picture.

      tl.from("#hook-1-inner", { opacity: 0, y: -40, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.to("#hook-1-inner", { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, 3.25);
      tl.set("#hook-1-inner", { opacity: 0 }, 3.6);   // hard kill on the exit boundary

      tl.from("#signoff-inner", { opacity: 0, y: -28, duration: 0.45, ease: "power3.out" }, 4.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
