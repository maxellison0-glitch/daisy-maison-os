<meta charset="utf-8">
<style>
@font-face{font-family:"TikTok Sans";src:url("TikTokSans-ExtraBold.woff2") format("woff2");font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:1080px;height:1920px}
.rail{position:absolute;left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center;gap:16px}
.p{display:inline-block;font-family:"TikTok Sans";font-weight:800;font-size:78px;line-height:1.12;letter-spacing:-0.01em;border-radius:999px;padding:0.24em 0.60em;box-shadow:0 4px 14px rgba(0,0,0,0.16);white-space:nowrap}
.white{color:#0E0E0E;background:rgba(255,255,255,0.94)}
.burg{color:#FFF;background:#6E1B2D}
</style>
<body><div class="rail"><span class="p white">POV: you finally gave</span><span class="p burg">Nan's garden a name</span></div></body>
